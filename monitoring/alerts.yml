# Алерти пишуться до інциденту. Пороги ті самі, що в rollback-критеріях README.
# Alertmanager у стенді немає, тож стан видно на http://localhost:9090/alerts.
groups:
  - name: llmops
    rules:
      - alert: ErrorRateHigh
        expr: 100 * sum(rate(llmops_log_rows_total{status!="200"}[5m])) / sum(rate(llmops_log_rows_total[5m])) > 5
        for: 2m
        annotations:
          summary: "Error rate понад 5% за 5 хв. Дії в INCIDENT_RUNBOOK.md, сценарій 1."
      - alert: ProviderDown
        expr: llmops_provider_status{status="down"} == 1
        for: 1m
        annotations:
          summary: "Запобіжник моделі {{ $labels.model }} відкритий понад хвилину."
      - alert: DbDown
        expr: llmops_db_up == 0
        for: 1m
        annotations:
          summary: "Сервіс не читає лог з бази. Плитки консолі віддають 503."
