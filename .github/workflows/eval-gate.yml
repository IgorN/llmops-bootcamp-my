name: eval-gate
# Шаблон для студентського репозиторію (корінь = вміст starter/).
# Піднімає стек, ганяє evals проти сервісу, блокує regression на pull request.
on:
  pull_request:

jobs:
  # назва job `eval` це і є required check у branch protection. Перейменування job тихо вимкне захист.
  eval:
    runs-on: ubuntu-latest
    # прогін триває хвилину. Без межі завислий стек тримав би PR до шести годин, і гейт почали б обходити.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Up stack (без UI — для evals не потрібен)
        run: docker compose up -d --build service

      - name: Wait for service
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health; then exit 0; fi
            sleep 5
          done
          echo "service did not become healthy"
          docker compose logs
          exit 1

      - name: Wait for gateway (холодний LiteLLM дає 500 на перший запит)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{"model":"mock","messages":[{"role":"user","content":"hi"}]}' || true)
            # успіх це будь-який 2xx, а не рівно 200
            case "$code" in 2??) exit 0 ;; esac
            sleep 5
          done
          echo "gateway not ready"
          docker compose logs gateway
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # поріг за правилом hw5 рахує evals/threshold.sh. До 10 кейсів N-1, далі 85% з округленням угору.
      # На 16 кейсах це 14, тобто запас на два флейки. «Зламаний промпт» v1 валить 4 кейси і завжди пробиває.
      # Поріг рахується з датасету, бо число в workflow застаріває з першим новим кейсом:
      # на 8 кейсах старе 5 пропускало зламаний v1 (5/8, exit 0).
      # Кейс, що МУСИТЬ ловитися поодинці (safety), дублюй варіаціями.
      - name: Evals
        env:
          SERVICE_URL: http://localhost:8080
        # pipefail обовʼязковий. Без нього exit code береться з tee, і червоний eval дав би зелений крок.
        run: |
          set -o pipefail
          python evals/run.py --dataset evals/golden.jsonl --threshold $(sh evals/threshold.sh evals/golden.jsonl) | tee eval.txt

      # результат кейсів на сторінці прогону, щоб причину падіння було видно без розгортання логів
      - name: Eval summary
        if: always()
        run: |
          if [ -f eval.txt ]; then
            { echo '```'; cat eval.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Down
        if: always()
        run: docker compose down -v
